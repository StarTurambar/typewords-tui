[package]
name = "typewords-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Type Words TUI - terminal word practice client"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/StarTurambar/typewords-tui"
keywords = ["tui", "terminal", "vocabulary", "fsrs", "english"]
categories = ["command-line-utilities", "education"]
publish = false

[lib]
name = "typewords_tui"
path = "src/lib.rs"

[[bin]]
name = "tw"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
rand = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
