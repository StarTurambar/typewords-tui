name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $name = "typewords-tui-$tag-x86_64-pc-windows-msvc"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/tw.exe $stage
          Copy-Item -Recurse assets $stage/assets
          Copy-Item -Recurse docs $stage/docs
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = ".github/release-notes/$tag.md"
          if (Test-Path $notes) {
            gh release create $tag dist/*.zip dist/*.sha256 --title $tag --notes-file $notes
          } else {
            gh release create $tag dist/*.zip dist/*.sha256 --title $tag --generate-notes
          }
