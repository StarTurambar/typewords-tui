name: Release

# 发布链路只由 v* tag 触发，但「推 tag」不再等于「发版」：
#   guard（tag、Cargo.toml 版本与 CHANGELOG.md 的版本小节一致）
#   → verify（fmt + clippy + Ubuntu / Windows 测试，命令与 ci.yml 完全一致）
#   → package（五平台归档 + 冒烟）
#   → release（校验和聚合 + 发布）
# verify 任何一项红灯，package 与 release 都不会启动：发布产物的提交本身必须全绿。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 最便宜的一关：tag、Cargo.toml 的 version 与 CHANGELOG.md 的版本小节对不上时立刻失败，
  # 不浪费后面的测试与五平台构建。
  guard:
    name: guard (tag / version / changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 Cargo.toml 的 version $version 不一致" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与 Cargo.toml 的 version $version 一致"
      - name: Check CHANGELOG documents this release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 发布说明只有一个来源：CHANGELOG.md 里该版本的小节。没有小节、或小节里没有条目，直接失败。
          echo "== ${GITHUB_REF_NAME} 的变更日志（来自 CHANGELOG.md）=="
          bash scripts/changelog.sh "$version"
          # 发版提交上 [Unreleased] 必须已经清空：还有未归档条目，说明这些改动没被写进任何版本小节。
          if bash scripts/changelog.sh unreleased > /tmp/unreleased.md 2>/dev/null; then
            echo "CHANGELOG.md 的 [Unreleased] 下还有未归档条目，发版前应整段移到「## [$version] - 日期」下：" >&2
            cat /tmp/unreleased.md >&2
            exit 1
          fi

  # 与 ci.yml 的 fmt / clippy 同一组命令；改 ci.yml 时这里要跟着改，tests/docs.rs 会校验两边一致。
  verify-lint:
    name: verify (fmt + clippy)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # 与 ci.yml 的 test 任务同一组命令与矩阵：tag 提交必须在 Ubuntu 与 Windows 上全绿。
  verify-test:
    name: verify (test, ${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  package:
    name: package (${{ matrix.target }})
    needs: [verify-lint, verify-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            packager: pwsh
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            packager: bash
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            packager: bash
          - target: aarch64-apple-darwin
            os: macos-latest
            packager: bash
          - target: x86_64-apple-darwin
            os: macos-latest
            packager: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Package (Windows)
        if: matrix.packager == 'pwsh'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Target ${{ matrix.target }}
      - name: Package (Linux / macOS)
        if: matrix.packager == 'bash'
        shell: bash
        run: bash scripts/package.sh --target ${{ matrix.target }}
      # 冒烟直接解压归档再跑：同时验证「归档能解、二进制是同版本、assets 与可执行文件同级」
      - name: Smoke test packaged archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem 'dist/*.tar.gz' | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'tw-smoke'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          tar -xzf $archive -C $dir
          if ($LASTEXITCODE -ne 0) { throw '解压归档失败' }
          $exe = Get-ChildItem (Join-Path $dir '*/tw.exe') | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw '归档里没有 tw.exe' }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $out = & $exe --version
          Write-Host "smoke: $out"
          if ($out -notmatch [regex]::Escape($version)) { throw "版本不符：$out（期望 $version）" }
          $home2 = Join-Path $env:RUNNER_TEMP 'tw-smoke-home'
          if (-not (& $exe doctor --home $home2 | Select-String -SimpleMatch 'CET-4')) {
            throw 'doctor 找不到内置 CET-4（assets/ 没有与可执行文件同级）'
          }
      # x86_64-apple-darwin 在 arm64 runner 上运行需要 Rosetta，只冒烟 Linux 与原生 arm64
      - name: Smoke test packaged archive (unix)
        if: runner.os == 'Linux' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$dir"
          exe=$(ls "$dir"/*/tw)
          echo "smoke: $exe"
          file "$exe" || true
          "$exe" --version
          "$exe" --version | grep -F "${GITHUB_REF_NAME#v}"
          "$exe" doctor --home "$(mktemp -d)" > "$dir/doctor.txt"
          if ! grep -F 'CET-4' "$dir/doctor.txt"; then
            cat "$dir/doctor.txt" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # 归档数必须与 release.yml 的 matrix 一致：缺包（命名漂移、只产 tar.gz 没产 .sha256）时直接失败。
          # `if-no-files-found` 只在完全没匹配到文件时报错，兜不住「少了其中一个平台」。
          expected=$(grep -c '^          - target: ' ../.github/workflows/release.yml)
          actual=$(ls -1 *.tar.gz | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "期望 $expected 个归档（见 release.yml 的 matrix），实际 $actual 个：$(ls -1)" >&2
            exit 1
          fi
          for archive in *.tar.gz; do
            sha256sum -c "$archive.sha256"
          done
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # 发布说明只从 CHANGELOG.md 提取（guard 已校验该小节存在、[Unreleased] 已清空），
          # 仓库里不再维护第二份发布说明。
          notes="$(mktemp)"
          bash scripts/changelog.sh "$version" > "$notes"
          # 页脚补一条「完整变更」比对链接，URL 直接取 CHANGELOG.md 底部为该版本写的链接定义。
          link="$(sed -n "s/^\[$version\]: //p" CHANGELOG.md | head -n 1)"
          if [ -n "$link" ]; then
            printf '\n**完整变更**：%s\n' "$link" >> "$notes"
          fi
          echo "== 发布说明（来自 CHANGELOG.md）=="
          cat "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag 已存在，改上传产物（--clobber）并用 CHANGELOG.md 的最新内容刷新正文"
            gh release upload "$tag" --clobber dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS --title "$tag" --notes-file "$notes"
          fi
